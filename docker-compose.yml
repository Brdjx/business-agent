# Postgres for local development, and nothing else.
#
# The agent reads a small business's records out of a database; this is that
# database. There is no app service here on purpose — the harness runs on the
# host under tsx, so the only thing worth containerising is the part with state.
#
# `npm run db:up` runs `docker compose up -d --wait`, which blocks on the
# healthcheck below. A zero exit therefore means the schema and the seed have
# applied, not merely that a container started.

# Pinned rather than inherited from the directory name. Compose defaults the
# project name to whatever folder the file sits in, so a clone into
# `business-agent-2` gets its own network and its own volume — two databases,
# and a `db:reset` in one that leaves the other's stale data in place.
name: business-agent

services:
  db:
    # Pinned to the major version, not `latest`. Postgres has had
    # gen_random_uuid() in core since 13, which is why nothing under db/ needs
    # the pgcrypto extension. That assumption should not be able to change
    # under a clone that worked yesterday.
    image: postgres:17
    container_name: business-agent-db

    environment:
      # Dev-only, and committed deliberately. This database holds synthetic
      # seed data, listens on localhost, and has one user. Nothing here is a
      # secret. Keeping it in an uncommitted .env would only mean a stranger
      # cannot start the thing without being told a password that protects
      # nothing.
      POSTGRES_USER: business_agent
      POSTGRES_PASSWORD: business_agent
      POSTGRES_DB: business_agent

    ports:
      # 5433 on the host, not 5432.
      #
      # A developer very often already has something on 5432 — a system
      # postgres, another project's compose. The clash itself is loud (the bind
      # fails), but the consequence is quiet: a DATABASE_URL pointing at 5432
      # connects happily to whatever else is listening, and the agent then
      # answers questions about someone else's database. "No such client" and
      # "these invoices are from another project" are a much longer debug than
      # a refused connection.
      - "5433:5432"

    volumes:
      # Every .sql in db/ is applied once, in lexical order, on the FIRST boot
      # of an empty data volume. Hence the numeric prefixes — 001-, 002-, 003-,
      # then 900-seed, which must sort after every schema file that its inserts
      # depend on.
      #
      # Two consequences worth knowing before they cost an hour:
      #
      #   * Editing a file in db/ after the first boot does nothing. The
      #     entrypoint only runs these scripts when the data directory is
      #     empty, so a restart brings back the old schema and the new column
      #     is simply absent. `npm run db:reset` is what applies changes.
      #
      #   * If one script fails, the entrypoint aborts and the container exits
      #     non-zero — but the data directory is already initialised, with the
      #     earlier scripts applied. The next `up` therefore skips init
      #     entirely and reports healthy with half a schema. After any failed
      #     init, reset rather than restart.
      #
      # Read-only: the container has no reason to write into the repo, and a
      # migration rewritten in place by something running as postgres is a
      # confusing way to lose work.
      - ./db:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data

    healthcheck:
      # -h 127.0.0.1 is load-bearing.
      #
      # During first boot the entrypoint starts a temporary server with
      # listen_addresses='' to apply the files in
      # /docker-entrypoint-initdb.d. That server answers on the unix socket,
      # so a socket-based pg_isready — the obvious version of this check —
      # reports ready while the seed is still being inserted, and `--wait`
      # hands back a database that is missing most of its rows. Over TCP
      # nothing answers until init has finished and the real server is
      # listening, which is the state the caller actually wants to wait for.
      #
      # $$ escapes to a literal $ for the container's shell, so the names come
      # from the environment above rather than being repeated here and drifting
      # out of step with it.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      # Init reads and applies every file in db/, which takes longer than one
      # interval. Failures inside the start period do not count against
      # retries, so a slow first boot is not reported as an unhealthy database.
      start_period: 40s

  # ---------------------------------------------------------------------------
  # The web UI: four surfaces over the same database.
  #
  # Here so that `docker compose up` gives a database AND something to read it
  # with. Everything else in this repository still runs on the host under tsx —
  # the CLI and the eval suite want your .env and your AWS profile — but a UI is
  # the part somebody wants left running without a terminal open.
  #
  # Two consequences worth knowing before they cost an afternoon:
  #
  #   * `npm run db:up` is `docker compose up -d --wait`, so it now builds this
  #     image as well. The first run therefore takes an npm install longer than
  #     it used to. `docker compose up -d --wait db` brings up only the database.
  #
  #   * This service has no healthcheck on purpose (see the Dockerfile), so
  #     --wait considers it ready as soon as it is running. A UI that has started
  #     and cannot reach Postgres shows the reason on its own pages, which is
  #     more use than a compose command that hangs.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: business-agent-web

    depends_on:
      db:
        # Not `depends_on: [db]`, which waits for the container to start rather
        # than for the database to be usable. On a first boot the schema and the
        # seed take tens of seconds, and a UI that starts in that window shows a
        # relation-does-not-exist error on every page and reads as broken.
        condition: service_healthy

    environment:
      # Written out rather than taken from the environment, and this is the trap
      # in this file. Compose interpolates ${...} from the .env sitting next to
      # it, and the DATABASE_URL in that file is
      # `postgres://…@localhost:5433/…` — the HOST mapping. Inside this network
      # the database is `db:5432`: localhost would be this container, and 5433 is
      # not a port anything here listens on. `env_file: .env` is absent for the
      # same reason.
      DATABASE_URL: postgres://business_agent:business_agent@db:5432/business_agent

      # These DO come from the host's environment or .env, because they should be
      # the same values the CLI runs with — the UI must show the same operator's
      # runs and approvals that `npm run ask` produces. The default is the
      # deliberately fake uuid from .env.example, so the UI starts with no .env
      # at all rather than exiting on a missing variable.
      USER_ID: ${USER_ID:-00000000-0000-4000-8000-000000000001}

      # Only the ask surface needs a model. The other three read Postgres, so the
      # UI is useful with no key set at all — and a page that needs one says
      # which variable is missing rather than failing blankly.
      #
      # PROVIDER=bedrock inside a container has no AWS profile and no instance
      # role to fall back on: pass credentials explicitly or leave it on the
      # anthropic adapter, which needs one key and plain fetch.
      PROVIDER: ${PROVIDER:-anthropic}
      MODEL: ${MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}

      PORT: "3000"
      # See the long note in the Dockerfile: loopback inside a container is the
      # container's own loopback, so binding it publishes nothing. The host-side
      # publication below is what makes this local-only.
      WEB_BIND: 0.0.0.0

    ports:
      # 127.0.0.1 explicitly, and this is the whole of the access control.
      #
      # `"3000:3000"` would bind every interface on the host, which on a laptop
      # means every machine on the network can open the approvals page — and that
      # page applies writes to the business. There is no authentication here and
      # none is pretended, so the address is the guard.
      - "127.0.0.1:3000:3000"

    # No restart policy, deliberately. This process exits 2 when DATABASE_URL or
    # USER_ID is wrong, and it prints the reason as one sentence; a container
    # restarting forever buries that sentence under a hundred copies of itself.

volumes:
  db-data:
